<script>
const route=[{"name":"START","position":{"x":-749.8763138584842,"y":10,"z":1684.0899396883597}},{"name":"A","position":{"x":-776.1,"y":10,"z":1536.4}},{"name":"B","position":{"x":-866.3,"y":24.8,"z":1028.4}},{"name":"C","position":{"x":-123.4,"y":23.6,"z":672.6}},{"name":"D","position":{"x":168.4,"y":22.4,"z":13}},{"name":"E","position":{"x":315.8,"y":27.2,"z":-595}},{"name":"F","position":{"x":866.3,"y":41.6,"z":-1098.9}},{"name":"G","position":{"x":613.6,"y":14.8,"z":-1536.4}}];

function layout(){

 const minX=Math.min(...route.map(p=>p.position.x)),maxX=Math.max(...route.map(p=>p.position.x)),minZ=Math.min(...route.map(p=>p.position.z)),maxZ=Math.max(...route.map(p=>p.position.z));
 const spanX=wide?maxZ-minZ:maxX-minX,spanY=wide?maxX-minX:maxZ-minZ,scale=Math.min((w-140)/spanX,(h-145)/spanY),cx=(minX+maxX)/2,cz=(minZ+maxZ)/2;
 state.points=route.map((p,i)=>({x:w/2+(wide?cz-p.position.z:p.position.x-cx)*scale,y:h/2-15+(wide?p.position.x-cx:p.position.z-cz)*scale,alt:p.position.y,name:p.name,index:i}));
 state.lengths=[0];for(let i=1;i<route.length;i++){const a=route[i-1].position,b=route[i].position;state.lengths.push(state.lengths[i-1]+Math.hypot(b.x-a.x,b.z-a.z,b.y-a.y));}state.total=state.lengths.at(-1);
 const path=state.points.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');node('path',{d:path,class:'route'},svg);state.travel=node('path',{d:'',class:'traveled'},svg);state.gates=[];
 for(const p of state.points){
